# GCP Audit Log Detections - free sample (5 detections)
# Schedules run every 15 minutes over a 20-minute window to tolerate ingestion lag.
# Alerts trigger when results > 0. Add your own alert actions (email, SOAR, notable events).

[default]
dispatch.earliest_time = -20m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 0
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.period = 1h

[GCP - 01 - Service Account Key Created]
description = A user-managed service account key was created. ATT&CK T1098.001. Severity: medium.
alert.severity = 3
alert.suppress.fields = principal,service_account
search = `gcp_audit` \
| where method="google.iam.admin.v1.CreateServiceAccountKey" AND status_code=0 \
| eval service_account=mvindex(split(resource, "/"), 3) \
| lookup gcp_sa_key_allowlist principal OUTPUT allowed \
| where isnull(allowed) \
| eval mitre_technique="T1098.001" \
| table _time, project, principal, service_account, caller_ip, user_agent, mitre_technique

[GCP - 02 - Owner or Editor Role Granted]
description = roles/owner or roles/editor granted on a project, folder or organization. ATT&CK T1098.003. Severity: high.
alert.severity = 4
alert.suppress.fields = member,role,resource
search = `gcp_audit` \
| where method="SetIamPolicy" AND status_code=0 \
| eval delta=mvzip(mvzip('protoPayload.serviceData.policyDelta.bindingDeltas{}.action', 'protoPayload.serviceData.policyDelta.bindingDeltas{}.role', "|"), 'protoPayload.serviceData.policyDelta.bindingDeltas{}.member', "|") \
| mvexpand delta \
| eval parts=split(delta, "|"), action=mvindex(parts, 0), role=mvindex(parts, 1), member=mvindex(parts, 2) \
| where action="ADD" AND in(role, "roles/owner", "roles/editor") \
| eval external=if(match(member, `gcp_org_domains`), "no", "yes"), mitre_technique="T1098.003" \
| table _time, project, resource, principal, member, role, external, caller_ip, mitre_technique

[GCP - 03 - Log Sink Deleted or Modified]
description = A Cloud Logging sink was deleted or updated. ATT&CK T1562.008. Severity: high (critical for sinks in gcp_critical_sinks).
alert.severity = 4
alert.suppress.fields = resource,method
search = `gcp_audit` \
| where in(method, "google.logging.v2.ConfigServiceV2.DeleteSink", "google.logging.v2.ConfigServiceV2.UpdateSink") AND status_code=0 \
| eval sink_name=mvindex(split(resource, "/"), -1), new_destination='protoPayload.request.sink.destination', new_filter='protoPayload.request.sink.filter', change=if(like(method, "%DeleteSink"), "DELETED", "UPDATED") \
| lookup gcp_critical_sinks sink_name OUTPUT critical \
| eval severity=if(critical="true", "critical", "high"), mitre_technique="T1562.008" \
| table _time, project, resource, sink_name, change, new_destination, new_filter, principal, caller_ip, severity, mitre_technique

[GCP - 04 - Firewall Opens SSH or RDP to Internet]
description = VPC firewall rule allows ingress from 0.0.0.0/0 or ::/0 on 22, 3389 or all ports. ATT&CK T1562.007. Severity: high.
alert.severity = 4
alert.suppress.fields = rule,project
search = `gcp_audit` \
| where in(method, "v1.compute.firewalls.insert", "v1.compute.firewalls.patch", "v1.compute.firewalls.update") AND status_code=0 \
| where isnull('operation.last') OR 'operation.first'="true" \
| eval rule=mvindex(split(resource, "/"), -1), direction=coalesce('protoPayload.request.direction', "INGRESS"), src='protoPayload.request.sourceRanges{}', proto='protoPayload.request.alloweds{}.IPProtocol', ports='protoPayload.request.alloweds{}.ports{}' \
| where direction="INGRESS" AND isnotnull(mvfind(src, "^(0\.0\.0\.0/0|::/0)$")) AND (isnotnull(mvfind(ports, "^(22|3389)$")) OR isnotnull(mvfind(proto, "^all$")) OR isnull(ports)) \
| eval exposed_ports=coalesce(mvjoin(ports, ","), "ALL"), mitre_technique="T1562.007" \
| table _time, project, rule, exposed_ports, src, principal, caller_ip, method, mitre_technique

[GCP - 05 - GCS Bucket Made Public]
description = Bucket IAM granted to allUsers or allAuthenticatedUsers. ATT&CK T1530. Severity: critical.
alert.severity = 5
alert.suppress.fields = bucket,member
search = `gcp_audit` \
| where method="storage.setIamPermissions" AND status_code=0 \
| eval delta=mvzip(mvzip('protoPayload.serviceData.policyDelta.bindingDeltas{}.action', 'protoPayload.serviceData.policyDelta.bindingDeltas{}.role', "|"), 'protoPayload.serviceData.policyDelta.bindingDeltas{}.member', "|") \
| mvexpand delta \
| eval parts=split(delta, "|"), action=mvindex(parts, 0), role=mvindex(parts, 1), member=mvindex(parts, 2) \
| where action="ADD" AND in(member, "allUsers", "allAuthenticatedUsers") \
| eval bucket=mvindex(split(resource, "/"), -1), mitre_technique="T1530" \
| lookup gcp_public_bucket_allowlist bucket OUTPUT allowed \
| where isnull(allowed) \
| table _time, project, bucket, member, role, principal, caller_ip, mitre_technique
