[gcp_audit]
definition = index=gcp sourcetype="google:gcp:pubsub:message" \
| rename data.* AS * \
| eval method='protoPayload.methodName', \
       principal='protoPayload.authenticationInfo.principalEmail', \
       caller_ip='protoPayload.requestMetadata.callerIp', \
       user_agent='protoPayload.requestMetadata.callerSuppliedUserAgent', \
       project='resource.labels.project_id', \
       resource='protoPayload.resourceName', \
       status_code=coalesce('protoPayload.status.code', 0)
iseval = 0
description = Base search for GCP Cloud Audit Logs. Edit index/sourcetype to match your environment.

[gcp_org_domains]
definition = "@yourcompany\.com$|gserviceaccount\.com$"
iseval = 0
description = Regex of internal member domains. Replace yourcompany\.com with your domain(s).
